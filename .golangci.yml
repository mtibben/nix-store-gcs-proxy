version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - err113
    - errname
    - errorlint
    - gosec
    - nilerr
    - nilnesserr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - wrapcheck
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
      disable-default-exclusions: true
